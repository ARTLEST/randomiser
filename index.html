<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Million Dollar Idea</title>
    <meta
      name="description"
      content="GeekRoom inspired randomiser for generating ideas across world, twist, and people."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand-wrap">
          <span class="brand-mark">MR</span>
          <span class="brand-name">Million Dollar Idea</span>
        </div>
      </header>

      <main class="main-panel">
        <div class="controls-row">
          <label class="team-label" for="teamNameInput">Team name</label>
          <input
            id="teamNameInput"
            type="text"
            maxlength="30"
            placeholder="e.g. Team Nova"
            value="Team Nova"
          />
          <button id="spinAllBtn" class="primary-btn">Spin all</button>
          <button id="downloadPdfBtn" class="secondary-btn">Download PDF</button>
        </div>

        <section class="randomiser-grid" aria-label="Idea randomiser wheels">
          <article class="slot" data-slot="world">
            <div class="slot-header">
              <span class="slot-label">The World</span>
            </div>

            <div class="wheel-outer">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel" data-wheel="world"></div>
            </div>
            <div class="selected-value" id="result-world">Healthcare</div>
          </article>

          <article class="slot" data-slot="twist">
            <div class="slot-header">
              <span class="slot-label">The Twist</span>
            </div>

            <div class="wheel-outer">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel" data-wheel="twist"></div>
            </div>
            <div class="selected-value" id="result-twist">AI</div>
          </article>

          <article class="slot" data-slot="people">
            <div class="slot-header">
              <span class="slot-label">The People</span>
            </div>

            <div class="wheel-outer">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel" data-wheel="people"></div>
            </div>
            <div class="selected-value" id="result-people">Students</div>
          </article>
        </section>

        <div class="center-action">
          <button id="centerSpinBtn" class="center-spin-btn">Spin Combo</button>
        </div>

        <aside class="log-panel" aria-live="polite">
          <div class="log-header">
            <span>Spin Log</span>
          </div>
          <ul id="spinLogList" class="log-list">
            <li class="log-entry is-empty">No spins yet. Press a Spin Combo button.</li>
          </ul>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
