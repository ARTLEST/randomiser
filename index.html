<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeekRoom Randomiser</title>
    <meta
      name="description"
      content="GeekRoom inspired randomiser for idea generation ideas across world, twist, and people."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="brand-block">
          <div class="brand-mark">GR</div>
          <div>
            <p class="eyebrow">GeekRoom</p>
            <h1>Million Dollar Idea</h1>
          </div>
        </div>

        <div class="header-controls">
          <label class="team-label" for="teamNameInput">Team name</label>
          <input
            id="teamNameInput"
            type="text"
            maxlength="30"
            placeholder="e.g. Team Nova"
            value="Team Nova"
          />
          <button id="spinAllBtn" class="primary-btn">Spin All</button>
          <button id="downloadPdfBtn" class="secondary-btn">Download PDF</button>
        </div>
      </header>

      <main class="randomiser-grid">
        <section class="slot" data-slot="world">
          <div class="slot-header">
            <span class="slot-label">THE WORLD</span>
          </div>

          <div class="wheel-outer">
            <div class="wheel" data-wheel="world">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel-center">
                <span id="result-world">Healthcare</span>
              </div>
            </div>
          </div>

          <button class="spin-btn" data-spin="world">Spin Combo</button>
        </section>

        <section class="slot" data-slot="twist">
          <div class="slot-header">
            <span class="slot-label">THE TWIST</span>
          </div>

          <div class="wheel-outer">
            <div class="wheel" data-wheel="twist">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel-center">
                <span id="result-twist">AI</span>
              </div>
            </div>
          </div>

          <button class="spin-btn" data-spin="twist">Spin Combo</button>
        </section>

        <section class="slot" data-slot="people">
          <div class="slot-header">
            <span class="slot-label">THE PEOPLE</span>
          </div>

          <div class="wheel-outer">
            <div class="wheel" data-wheel="people">
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel-center">
                <span id="result-people">Students</span>
              </div>
            </div>
          </div>

          <button class="spin-btn" data-spin="people">Spin Combo</button>
        </section>
      </main>

      <aside class="log-panel" aria-live="polite">
        <div class="log-header">
          <span>Spin Log</span>
        </div>
        <ul id="spinLogList" class="log-list">
          <li class="log-entry is-empty">No spins yet. Press a Spin Combo button.</li>
        </ul>
      </aside>
    </div>

    <script src="script.js"></script>
  </body>
</html>
